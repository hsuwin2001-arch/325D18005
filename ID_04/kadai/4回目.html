        <h1>日本の綺麗な場所</h1>
        <p class="m-plus-rounded-1c-semibold orange">日本には全国各地に絶景スポットがある。季節折々の美し名所や神社仏閣など、多くの観光地があります。
        その中であしかがフラワーパークという場所が春に一番人気があると思う。</p>
        <p class="m-plus-rounded-1c-thin green">あしかがフラワーパークは、栃木県足利市にある花のテーマパークで、特に藤の花が有名です。春には美しい藤のトンネルが広がり、多くの観光客が訪れます。</p>
        <p class="m-plus-rounded-1c-bold orange">また、あしかがフラワーパークでは、四季折々の花々が楽しめるイベントも開催されており、訪れるたびに新しい発見があります。夜にはライトアップされた藤の花が幻想的な雰囲気を醸し出し、、昼間とはまた違った魅力を楽しむことができます。</p>
